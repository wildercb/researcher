# Atlas LLM model configuration
# Updated via Settings UI

default:
  model: ollama/granite4:micro
  temperature: 0.3
  max_tokens: 4096
agents:
  relevance_scorer:
    model: ollama/granite4:micro
    temperature: 0.1
  classifier:
    model: ollama/granite4:micro
    temperature: 0.0
  summarizer:
    model: ollama/granite4:micro
    temperature: 0.3
  briefing_writer:
    model: ollama/granite4:micro
    temperature: 0.5
  ideation_agent:
    model: ollama/granite4:micro
    temperature: 0.7
  fit_agent:
    model: ollama/granite4:micro
    temperature: 0.3
  trend_detector:
    model: ollama/granite4:micro
    temperature: 0.1
  controversy_watcher:
    model: ollama/granite4:micro
    temperature: 0.2
  seed_scout:
    model: ollama/granite4:micro
    temperature: 0.3
  general:
    model: ollama/granite4:micro
    temperature: 0.3
embedding:
  model: ollama/nomic-embed-text
  dimensions: 768
daily_cost_cap_usd: 5.0
fallback:
  enabled: true
  model: ollama/granite4:micro
